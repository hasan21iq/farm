<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5a9e3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>مزرعتي — لعبة مزرعة الحيوانات</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>

  <header id="hud">
    <div class="hud-row">
      <div class="hud-item money" title="الرصيد"><span>💰</span><b id="hud-money">0</b></div>
      <div class="hud-item feed" title="العلف"><span>🌾</span><b id="hud-feed">0</b></div>
      <div class="hud-item level" title="المستوى">
        <span class="star">⭐<b id="hud-level">1</b></span>
        <div class="xpbar"><i id="hud-xp"></i></div>
      </div>
      <button id="menu-btn" aria-label="القائمة">⚙️</button>
    </div>
    <div class="hud-row second">
      <div class="hud-item clock" id="hud-clock">☀️ يوم 1 · 07:00</div>
      <div id="event"></div>
    </div>
  </header>

  <div id="toasts"></div>

  <button id="quick-feed" aria-label="إطعام الكل">🌾<small>إطعام</small><span class="badge orange"></span></button>

  <section id="sheet">
    <div id="sheet-head">
      <div class="grip"></div>
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" aria-label="إغلاق">✕</button>
    </div>
    <div id="sheet-body"></div>
  </section>

  <nav id="bottombar">
    <button data-panel="animals"><span>🐄</span><small>الحيوانات</small><i class="badge"></i></button>
    <button data-panel="farm"><span>🌱</span><small>الزراعة</small><i class="badge"></i></button>
    <button data-panel="storage"><span>🏚️</span><small>المخزن</small><i class="badge"></i></button>
    <button data-panel="sale"><span>🤝</span><small>البيع</small><i class="badge"></i></button>
    <button data-panel="ship"><span>⛴️</span><small>السفينة</small><i class="badge"></i></button>
    <button data-panel="heli"><span>🚁</span><small>هليكوبتر</small><i class="badge"></i></button>
    <button data-panel="vet"><span>🩺</span><small>الطبيب</small><i class="badge"></i></button>
    <button data-panel="upgrades"><span>🔨</span><small>التطوير</small><i class="badge"></i></button>
  </nav>

  <div id="loading">🚜 جارِ تحميل المزرعة...</div>

  <script src="js/config.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
